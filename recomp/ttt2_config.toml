# Codegen configuration for Tekken Tag Tournament 2 (TU3-patched image). Addresses only - no game bytes.
#
# Every entry added here must say where it came from (measured with which tool on which image hash).
# Milestone 3 fills this in; until then the file only pins the baseline flags.

# Register-localisation optimizations stay OFF until the game boots and the determinism tests pass;
# they are then enabled one at a time (docs/ARCHITECTURE.md, section 3B).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

[analysis]
max_jump_extension = 65536
data_region_threshold = 16

# [[invalid_instructions]] entries are ADDRESSES in ReXGlue (`data` = guest address of the first
# word, `size` = bytes), unlike XenonRecomp where `data` is an instruction pattern. Zero padding
# needs no entry: the analysis treats runs of zero words as data on its own. TTT2's four
# data-as-code trap sites (macchwu / maclhwu / blrl words, reported by TTT2 Web) get entries here
# once the owner's codegen report (recomp/tools/codegen_report.py) shows their addresses in the
# TU3 image, e.g.
#   [[invalid_instructions]]
#   data = 0x82XXXXXX   # measured on image SHA-1 ...
#   size = 4

# [functions]        explicit boundaries for leaf functions split by jump tables (Milestone 3).
#                    recomp/ttt2_functions.ttt2web.toml holds 18k of them converted from TTT2 Web (CC0);
#                    ttt2_manifest.ttt2web.toml includes it when the image's save/restore helper
#                    addresses match TTT2 Web's published ones (ttt2-xexinfo --helpers reports this).
# [[switch_tables]]  the 526-535 TTT2 jump tables (Milestone 3; symbolic finder if the SDK misses them)
# [[midasm_hook]]    netplay hooks: frame boundary, input entry builder, srand seeds (Milestone 6)
# [rexcrt]           memcpy / memset / heap redirects once measured (Milestone 4)
