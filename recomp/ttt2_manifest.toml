# ReXGlue project manifest for Tekken Tag Tournament 2 (generated by `rexglue init`, SDK 0.10.0, then edited).
#
# `file_path` must point at the player's OWN, locally produced, Title-Update-3-patched Default.xex
# (see docs/ROADMAP.md Milestone 3). The file is never committed; `game/` is git-ignored.

[project]
name = "ttt2"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = [
  "ttt2_config.toml",
  # written by recomp/tools/find_switch_tables.py on game/default.xex (scripts/build-host.ps1 and the
  # owner pipeline run it before codegen): the jump tables the SDK's own detector gets wrong
  "game/ttt2_switch_tables.toml",
  # written by recomp/tools/resolve_functions.py, which runs codegen (scripts/build-host.ps1 and the
  # owner pipeline call it instead of rexglue directly): the function entry points and boundaries the
  # SDK's analysis misses on this image, each verified against the image and TTT2 Web's published
  # table before it is added (git-ignored with the image; it starts empty and is image-specific)
  "game/ttt2_resolved_functions.toml",
]
