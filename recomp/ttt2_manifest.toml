# ReXGlue project manifest for Tekken Tag Tournament 2 (generated by `rexglue init`, SDK 0.10.0, then edited).
#
# `file_path` must point at the player's OWN, locally produced, Title-Update-3-patched Default.xex
# (see docs/ROADMAP.md Milestone 3). The file is never committed; `game/` is git-ignored.

[project]
name = "ttt2"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = [
  "ttt2_config.toml",
]
