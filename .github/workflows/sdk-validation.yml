name: SDK validation (ReXGlue on Linux)

# Builds the pinned ReXGlue SDK codegen tool with Clang 20 and runs the SDK's own PowerPC
# instruction test suite (no game files involved). Slow (30-60 minutes), so it runs on demand
# and weekly rather than on every push. Mirrors what was verified by hand in session 1/2.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  rexglue-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 and the SDK's Linux dependencies
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 libclang-rt-20-dev cmake ninja-build nasm \
            libgtk-3-dev libxss-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-cursor-dev \
            libxkbcommon-x11-dev libxcb-util-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-xinerama0-dev \
            libxcb-present-dev libxcb-dri3-dev libxcb-sync-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev libpulse-dev libwayland-dev \
            libdecor-0-dev libxkbcommon-dev libdrm-dev libgbm-dev libibus-1.0-dev libudev-dev libegl1-mesa-dev \
            libgl1-mesa-dev libdbus-1-dev
      - name: Fetch the pinned SDK
        run: scripts/fetch-rexglue-sdk.sh
      - name: Build the codegen tool and run the PPC instruction tests
        run: scripts/build-rexglue-linux.sh third_party/rexglue-sdk/src --with-tests
      - name: Regenerate the instruction tests with recompile-tests (smoke)
        run: scripts/sdk-recompile-tests.sh third_party/rexglue-sdk/src third_party/rexglue-sdk/src/out/linux-amd64/rexglue out/ppc-tests
      - name: End-to-end codegen smoke test on license-free PowerPC programs
        # --exec also builds recomp/tests/host against the SDK runtime and runs the switch-table program
        # natively (fails with the SDK's own tables, passes with the finder's, reaches no kernel stubs).
        run: scripts/codegen-smoke-test.sh third_party/rexglue-sdk/src/out/linux-amd64/rexglue third_party/rexglue-sdk/src out/codegen-smoke --exec
      - name: "Instruction coverage of the TTT2 instruction list (2 known gaps: macchwu, maclhwu)"
        run: python3 -I scripts/check_instruction_coverage.py --expect-missing 2
      - name: Upload codegen reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-smoke-reports
          path: |
            out/codegen-smoke/**/REPORT.md
            out/codegen-smoke/**/report.json
            out/codegen-smoke/**/codegen.log
      - name: Hygiene check
        run: python3 scripts/check_repo_hygiene.py
