name: SDK validation (ReXGlue on Linux)

# Builds the pinned ReXGlue SDK codegen tool with Clang 20 and runs the SDK's own PowerPC
# instruction test suite (no game files involved). Slow (30-60 minutes), so it runs on demand
# and weekly rather than on every push. Mirrors what was verified by hand in session 1/2.

on:
  workflow_dispatch:
    inputs:
      sdk_commit:
        description: "ReXGlue SDK commit to build instead of the pin (third_party/rexglue-sdk/PIN): for evaluating a snapshot; empty = the pin"
        type: string
        default: ""
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  rexglue-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 and the SDK's Linux dependencies
        run: |
          sudo apt-get update
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 libclang-rt-20-dev cmake ninja-build nasm \
            libgtk-3-dev libxss-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-cursor-dev \
            libxkbcommon-x11-dev libxcb-util-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-xinerama0-dev \
            libxcb-present-dev libxcb-dri3-dev libxcb-sync-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev libpulse-dev libwayland-dev \
            libdecor-0-dev libxkbcommon-dev libdrm-dev libgbm-dev libibus-1.0-dev libudev-dev libegl1-mesa-dev \
            libgl1-mesa-dev libdbus-1-dev xvfb
      - name: Fetch the pinned SDK (or the sdk_commit snapshot)
        env:
          REXGLUE_SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: scripts/fetch-rexglue-sdk.sh
      - name: Build the codegen tool and run the PPC instruction tests
        run: scripts/build-rexglue-linux.sh third_party/rexglue-sdk/src --with-tests
      - name: Regenerate the instruction tests with recompile-tests (smoke)
        run: scripts/sdk-recompile-tests.sh third_party/rexglue-sdk/src third_party/rexglue-sdk/src/out/linux-amd64/rexglue out/ppc-tests
      - name: End-to-end codegen smoke test on license-free PowerPC programs
        # --exec also builds recomp/tests/host against the SDK runtime and runs the switch-table program
        # natively (fails with the SDK's own tables, passes with the finder's, reaches no kernel stubs).
        run: scripts/codegen-smoke-test.sh third_party/rexglue-sdk/src/out/linux-amd64/rexglue third_party/rexglue-sdk/src out/codegen-smoke --exec
      - name: Build the first-party tools (ttt2-xexinfo and the retail-form wrapper for the pipeline's preparation step)
        run: |
          cmake --preset linux-clang -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          cmake --build --preset linux-clang --target ttt2-xexinfo ttt2_make_retail_xex
      - name: Install the SDK as a CMake package, build the game host against it and boot it
        # The player's build path (scripts/build-host.ps1 on Windows): the SDK installed with
        # `--target install`, recomp/ configured with CMAKE_PREFIX_PATH, codegen running inside the
        # build on the license-free kernel-import program standing in for the game image. The host
        # (the real ReXApp: window, runtime, recompiled code, Ttt2App hooks) is then booted headless
        # on it: the program's calls must reach the host's kernel overrides and the host must exit.
        run: |
          cmake -S third_party/rexglue-sdk/src -B third_party/rexglue-sdk/src/build/linux -DREXGLUE_BUILD_TESTS=OFF
          cmake --build third_party/rexglue-sdk/src/build/linux --parallel
          cmake --install third_party/rexglue-sdk/src/build/linux --prefix "$PWD/out/sdk-install"
          mkdir -p recomp/game out/host-retail
          # The owner's path: the executable arrives in the disc's retail form (AES-encrypted, basic-compressed), which
          # neither the finder nor codegen read; the pipeline's step 5c (ttt2-xexinfo --write-plain) prepares the plain
          # image they do. The wrapper puts the license-free program into that form first.
          out/build/linux-clang/bin/ttt2_make_retail_xex out/codegen-smoke/imports_ttt2/imports_ttt2.xex out/host-retail/default.xex
          out/build/linux-clang/bin/ttt2-xexinfo out/host-retail/default.xex --write-plain recomp/game/default.xex --no-hash | tail -3
          # the manifests include the switch-table finder's output for the image (build-host.ps1 does this on Windows)
          python3 -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables.json
          # codegen before the first configure: the generated glue only picks the recompiled sources up
          # when generated/default exists at configure time (a fresh tree has none). It runs through the
          # function-boundary resolver, as build-host.ps1 and the owner pipeline run it (the manifest includes
          # its output file; the reference does not apply to this image, whose helper fingerprint differs)
          python3 -I recomp/tools/resolve_functions.py codegen --rexglue out/sdk-install/bin/rexglue --manifest recomp/ttt2_manifest.toml --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen.log --report out/host-resolve.md
          grep -q "codegen succeeded in round 1" out/host-resolve.md
          cmake -S recomp -B out/host-linux -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/out/sdk-install"
          cmake --build out/host-linux --parallel
          ls -la out/host-linux/
          scripts/host-boot-test.sh out/host-linux/ttt2 recomp/game 120
          # The owner's extracted game folder holds the disc's default.xex in its retail form: the runtime must load that
          # itself (decrypt, decompress) and run the same recompiled code. Same host, the retail-form file as the root's executable.
          scripts/host-boot-test.sh out/host-linux/ttt2 out/host-retail 120
          # The owner's one-command boot step (scripts/run-host.ps1 under the runner's pwsh) on the same image,
          # with an Xvfb of this step's own: the host must end by itself and the triage report a clean exit.
          Xvfb :97 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          xvfb_pid=$!
          sleep 1
          DISPLAY=:97 SDL_AUDIO_DRIVER=dummy pwsh -NoProfile -File scripts/run-host.ps1 -Exe out/host-linux/ttt2 -GameRoot recomp/game -Work out/run-host -TimeoutSeconds 120 -NoGpu
          grep -q "clean exit" out/run-host/boot-triage.md
          # The same host rebuilt on a program that spins forever: the watchdog's stall dump must fire.
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/stall_ttt2.s recomp/game/default.xex
          python3 -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-stall.json
          python3 -I recomp/tools/resolve_functions.py codegen --rexglue out/sdk-install/bin/rexglue --manifest recomp/ttt2_manifest.toml --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen-stall.log --report out/host-resolve-stall.md --ignore-stamp
          cmake --build out/host-linux --parallel
          scripts/host-boot-test.sh out/host-linux/ttt2 recomp/game --expect-stall
          # The boot step on it: the 8 s timeout sends the close request (SIGTERM) after the 1 s watchdog's stall
          # dump; the host must exit 0 and the triage report the stall and the close.
          DISPLAY=:97 SDL_AUDIO_DRIVER=dummy TTT2_WATCHDOG_MS=1000 pwsh -NoProfile -File scripts/run-host.ps1 -Exe out/host-linux/ttt2 -GameRoot recomp/game -Work out/run-host-stall -TimeoutSeconds 8 -NoGpu
          grep -q '^\*\*stall: .*closed afterwards\*\*' out/run-host-stall/boot-triage.md
          kill "$xvfb_pid"
          # And on a program that writes to the null page: the crash report must be logged and the host exit 3.
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/crash_ttt2.s recomp/game/default.xex
          python3 -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-crash.json
          python3 -I recomp/tools/resolve_functions.py codegen --rexglue out/sdk-install/bin/rexglue --manifest recomp/ttt2_manifest.toml --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen-crash.log --report out/host-resolve-crash.md --ignore-stamp
          cmake --build out/host-linux --parallel
          scripts/host-boot-test.sh out/host-linux/ttt2 recomp/game --expect-crash
          # The function-boundary cycle on the real host (recomp/tests/ppc/tailcall_ttt2.s, its boundary table as the
          # reference): codegen through the resolver adds the two entries its errors call for; the host then calls a
          # leaf only a pointer reaches, which nothing registered, and must end on the runtime's trap with exit code 4;
          # resolve_functions.py boot turns the host's own log line into an entry; after codegen and the rebuild the
          # program runs to its end. The owner pipeline's step 9b does exactly this with TTT2 Web's table.
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/tailcall_ttt2.s recomp/game/default.xex
          python3 -I recomp/tests/ppc/functions_to_toml.py recomp/game/default.xex.syms recomp/tests/ppc/tailcall_ttt2.functions out/tailcall-reference.toml
          python3 -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-tailcall.json
          python3 -I recomp/tools/resolve_functions.py codegen --rexglue out/sdk-install/bin/rexglue --manifest recomp/ttt2_manifest.toml --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml --reference out/tailcall-reference.toml --log out/host-codegen-tailcall.log --report out/host-resolve-tailcall.md --ignore-stamp
          grep -q "codegen succeeded in round 2 with 2 resolved entries" out/host-resolve-tailcall.md
          cmake --build out/host-linux --parallel
          scripts/host-boot-test.sh out/host-linux/ttt2 recomp/game 60 --expect-fatal
          python3 -I recomp/tools/resolve_functions.py boot --image recomp/game/default.xex \
            --boot-log "$(ls -t out/host-linux/logs/*.log | head -1)" --codegen-log out/host-codegen-tailcall.log \
            --reference out/tailcall-reference.toml --out recomp/game/ttt2_resolved_functions.toml --report out/host-resolve-tailcall-boot.md
          grep -q "all 1 called addresses verified (1 new entries)" out/host-resolve-tailcall-boot.md
          python3 -I recomp/tools/resolve_functions.py codegen --rexglue out/sdk-install/bin/rexglue --manifest recomp/ttt2_manifest.toml --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml --reference out/tailcall-reference.toml --log out/host-codegen-tailcall2.log --report out/host-resolve-tailcall2.md --ignore-stamp
          grep -q "codegen succeeded in round 1 with 3 resolved entries" out/host-resolve-tailcall2.md
          cmake --build out/host-linux --parallel
          scripts/host-boot-test.sh out/host-linux/ttt2 recomp/game 60 --no-imports
      - name: Upload the host boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-linux-boot-log
          path: |
            out/host-linux/logs/
            out/run-host/
            out/run-host-stall/
            out/host-resolve*.md
          if-no-files-found: ignore
      - name: "Instruction coverage of the TTT2 instruction list (2 known gaps: macchwu, maclhwu)"
        run: python3 -I scripts/check_instruction_coverage.py --expect-missing 2
      - name: Upload codegen reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-smoke-reports
          path: |
            out/codegen-smoke/**/REPORT.md
            out/codegen-smoke/**/report.json
            out/codegen-smoke/**/codegen.log
      - name: Hygiene check
        run: python3 scripts/check_repo_hygiene.py
