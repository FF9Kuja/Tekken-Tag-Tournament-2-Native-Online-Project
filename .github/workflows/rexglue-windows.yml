name: ReXGlue codegen tool (Windows)

# Builds the pinned ReXGlue SDK's codegen tool on a Windows runner with the recipe the SDK's own
# CI uses (LLVM clang + Ninja, win-amd64 preset), runs the license-free codegen smoke test on it
# and uploads rexglue.exe as an artifact, so the recipe in scripts/build-rexglue-windows.ps1 is
# proven on real Windows and the owner can download the tool instead of building it. Manual and
# weekly: the SDK build takes a long time. No game content is involved.

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: "Also build the headless host against the SDK runtime and run the switch-table program natively (adds an hour or more)"
        type: boolean
        default: false
      build_host:
        description: "Also install the SDK as a CMake package and build the game host ttt2.exe from the license-free test program with scripts/build-host.ps1 (adds an hour or more)"
        type: boolean
        default: false
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  rexglue-win-amd64:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20, CMake and Ninja
        run: |
          choco install llvm --version=20.1.8 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "pinned LLVM unavailable, installing the latest"; choco install llvm -y --no-progress }
          choco install cmake ninja -y --no-progress
          clang --version
          # the SDK's submodules hold paths longer than 260 characters
          git config --global core.longpaths true
      - name: Fetch the pinned SDK
        run: scripts\fetch-rexglue-sdk.ps1
      - name: Build rexglue.exe
        run: scripts\build-rexglue-windows.ps1
      - name: Locate the tool
        id: tool
        shell: bash
        run: |
          exe=$(find third_party/rexglue-sdk/src/out -name rexglue.exe -not -path '*CMakeFiles*' | head -1)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          "$exe" --version
      - name: Codegen smoke test (license-free PowerPC programs)
        shell: bash
        env:
          CC: clang
          CXX: clang++
          NATIVE_RUN: ${{ inputs.native_run && 'true' || 'false' }}
        run: |
          # The official LLVM builds for Windows have no PowerPC backend (X86/ARM/AArch64 only), so the
          # two C test programs cannot be built here and --allow-no-ppc-clang skips them (Linux CI covers
          # them); the TTT2-shaped assembly programs are assembled with the SDK's Cygwin-built PowerPC
          # binutils (.exe). With native_run the SDK source tree is passed too and --exec builds
          # recomp/tests/host (the runtime) and runs the switch-table program natively on Windows.
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          if [ "$NATIVE_RUN" = true ]; then
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" third_party/rexglue-sdk/src out/codegen-smoke --exec --allow-no-ppc-clang
          else
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" "" out/codegen-smoke --allow-no-ppc-clang
          fi
      - name: Upload rexglue.exe
        # Even when the smoke test fails: the tool itself is the deliverable the owner downloads.
        if: always() && steps.tool.outputs.exe != ''
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-win-amd64
          path: ${{ steps.tool.outputs.exe }}
          retention-days: 90
      # --- optional: the game host built the way a player builds it ---------------------------------
      - name: Install the SDK as a CMake package (runtime, GPU plugin, SDL3; long)
        if: inputs.build_host
        run: scripts\build-rexglue-windows.ps1 -Install
      - name: Pack the license-free kernel-import program as the host's game image
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          mkdir -p recomp/game
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/imports_ttt2.s recomp/game/default.xex
      - name: Build ttt2.exe against the installed SDK (codegen runs inside the build)
        if: inputs.build_host
        run: scripts\build-host.ps1
      - name: Boot ttt2.exe on the license-free image (no GPU plugin) and check its log
        # The real host on Windows: window, runtime, recompiled code, Ttt2App hooks and the kernel
        # overrides; the program ends and the host must exit with code 0 (scripts/host-boot-test.sh).
        if: inputs.build_host
        shell: bash
        run: scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 120
      - name: Run the owner's boot step (scripts\run-host.ps1) on the same image
        # The one command of docs\OWNER_CHECKLIST.md step 6: runs the host, waits for its exit, triages the
        # log (recomp\tools\triage_boot_log.py), copies it and writes the run report. The program ends by
        # itself here, so the host must exit 0 and the triage report a clean exit.
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host -TimeoutSeconds 120 -NoGpu
          if ($LASTEXITCODE -ne 0) { throw "run-host.ps1 exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out\run-host\boot-triage.md -Pattern "clean exit" -Quiet)) { throw "the triage did not report a clean exit" }
          if (-not (Get-ChildItem out\run-host\boot-logs -File)) { throw "no log copy in out\run-host\boot-logs" }
      - name: Boot ttt2.exe with the Xenos GPU plugin (D3D12 on the runner's software adapter; informative)
        # The first exercise of the graphics path: plugin load, D3D12 device, presentation. The runner
        # has no GPU, so this may fail for reasons the owner's machine will not have; it never blocks.
        if: inputs.build_host
        continue-on-error: true
        shell: bash
        run: |
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 120 --gpu
          cp recomp/out/build/win-amd64-release/logs/*.log out/host-gpu-boot.log 2>/dev/null || true
      - name: Upload the GPU boot log
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-gpu-boot-log
          path: out/host-gpu-boot.log
          if-no-files-found: ignore
      - name: Boot ttt2.exe on the crashing and the stalling programs (crash report, stall dump)
        # The same host rebuilt on recomp/tests/ppc/crash_ttt2.s (writes to the null page: HOST CRASH
        # block, exit code 3) and stall_ttt2.s (spins forever: the watchdog's per-thread stall dump).
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/third_party/rexglue-sdk/src/out/install/win-amd64/bin/rexglue.exe"
          for program in crash stall; do
            scripts/make-ppc-test-xex.sh "recomp/tests/ppc/${program}_ttt2.s" recomp/game/default.xex
            python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json "out/host-switch_tables-$program.json"
            (cd recomp && "$rexglue" codegen --ignore-stamp ttt2_manifest.toml && cmake --build --preset win-amd64-release)
            scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game "--expect-$program"
          done
      - name: Run the owner's boot step on the stalling program (the timeout closes the window)
        # The host is still built on stall_ttt2.s: with a 1 s watchdog period the stall dump appears within a
        # few seconds, the 8 s timeout sends the close request the X button sends (taskkill), the host writes
        # its stub report and exits 0, and the triage must report the stall and the close.
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
          TTT2_WATCHDOG_MS: "1000"
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host-stall -TimeoutSeconds 8 -NoGpu
          if ($LASTEXITCODE -ne 0) { throw "run-host.ps1 exit code $LASTEXITCODE" }
          $md = Get-Content out\run-host-stall\boot-triage.md -Raw
          if ($md -notmatch "\*\*stall: .*closed afterwards\*\*") { throw "the triage did not report the stall and the close" }
          Get-Content out\run-host-stall\boot-report.txt
      - name: Upload the host boot log and the boot-step reports
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-boot-log
          path: |
            recomp/out/build/win-amd64-release/logs/
            out/run-host/
            out/run-host-stall/
          if-no-files-found: ignore
      - name: Upload the host build listing
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-listing
          path: recomp/out/build/win-amd64-release/host-listing.txt
          if-no-files-found: ignore
      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-smoke-reports
          path: |
            out/codegen-smoke/**/REPORT.md
            out/codegen-smoke/**/report.json
            out/codegen-smoke/**/codegen.log
