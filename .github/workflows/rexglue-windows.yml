name: ReXGlue codegen tool (Windows)

# Builds the pinned ReXGlue SDK's codegen tool on a Windows runner with the recipe the SDK's own
# CI uses (LLVM clang + Ninja, win-amd64 preset), runs the license-free codegen smoke test on it
# and uploads rexglue.exe as an artifact, so the recipe in scripts/build-rexglue-windows.ps1 is
# proven on real Windows and the owner can download the tool instead of building it. Manual and
# weekly: the SDK build takes a long time. No game content is involved.

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: "Also build the headless host against the SDK runtime and run the switch-table program natively (adds an hour or more)"
        type: boolean
        default: false
      build_host:
        description: "Also install the SDK as a CMake package and build the game host ttt2.exe from the license-free test program with scripts/build-host.ps1 (adds an hour or more)"
        type: boolean
        default: false
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  rexglue-win-amd64:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20, CMake and Ninja
        run: |
          choco install llvm --version=20.1.8 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "pinned LLVM unavailable, installing the latest"; choco install llvm -y --no-progress }
          choco install cmake ninja -y --no-progress
          clang --version
          # the SDK's submodules hold paths longer than 260 characters
          git config --global core.longpaths true
      - name: Fetch the pinned SDK
        run: scripts\fetch-rexglue-sdk.ps1
      - name: Build rexglue.exe
        run: scripts\build-rexglue-windows.ps1
      - name: Locate the tool
        id: tool
        shell: bash
        run: |
          exe=$(find third_party/rexglue-sdk/src/out -name rexglue.exe -not -path '*CMakeFiles*' | head -1)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          "$exe" --version
      - name: Codegen smoke test (license-free PowerPC programs)
        shell: bash
        env:
          CC: clang
          CXX: clang++
          NATIVE_RUN: ${{ inputs.native_run && 'true' || 'false' }}
        run: |
          # make-ppc-test-xex.sh uses clang/ld.lld (LLVM is multi-target) for C sources and the SDK's
          # Windows binutils (.exe) for assembly sources. With native_run the SDK source tree is passed
          # too and --exec builds recomp/tests/host (the runtime) and runs the program on Windows.
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          if [ "$NATIVE_RUN" = true ]; then
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" third_party/rexglue-sdk/src out/codegen-smoke --exec
          else
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" "" out/codegen-smoke
          fi
      - name: Upload rexglue.exe
        # Even when the smoke test fails: the tool itself is the deliverable the owner downloads.
        if: always() && steps.tool.outputs.exe != ''
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-win-amd64
          path: ${{ steps.tool.outputs.exe }}
          retention-days: 90
      # --- optional: the game host built the way a player builds it ---------------------------------
      - name: Install the SDK as a CMake package (runtime, GPU plugin, SDL3; long)
        if: inputs.build_host
        run: scripts\build-rexglue-windows.ps1 -Install
      - name: Pack the license-free switch-table program as the host's game image
        if: inputs.build_host
        shell: bash
        env:
          CC: clang
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          mkdir -p recomp/game
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/switch_ttt2.s recomp/game/default.xex
      - name: Build ttt2.exe against the installed SDK (codegen runs inside the build)
        if: inputs.build_host
        run: scripts\build-host.ps1
      - name: Upload the host build listing
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-listing
          path: recomp/out/build/win-amd64-release/host-listing.txt
          if-no-files-found: ignore
      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-smoke-reports
          path: |
            out/codegen-smoke/**/REPORT.md
            out/codegen-smoke/**/report.json
            out/codegen-smoke/**/codegen.log
