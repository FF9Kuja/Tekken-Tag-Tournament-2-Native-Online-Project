name: ReXGlue codegen tool (Windows)

# Builds the pinned ReXGlue SDK's codegen tool on a Windows runner with the recipe the SDK's own
# CI uses (LLVM clang + Ninja, win-amd64 preset), runs the license-free codegen smoke test on it
# and uploads rexglue.exe as an artifact, so the recipe in scripts/build-rexglue-windows.ps1 is
# proven on real Windows and the owner can download the tool instead of building it. Manual and
# weekly: the SDK build takes a long time. No game content is involved.

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: "Also build the headless host against the SDK runtime and run the switch-table program natively (adds an hour or more)"
        type: boolean
        default: false
      build_host:
        description: "Also install the SDK as a CMake package and build the game host ttt2.exe from the license-free test program with scripts/build-host.ps1 (adds an hour or more)"
        type: boolean
        default: false
      sdk_commit:
        description: "ReXGlue SDK commit to build instead of the pin (third_party/rexglue-sdk/PIN): for evaluating a snapshot; empty = the pin"
        type: string
        default: ""
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  rexglue-win-amd64:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20, CMake and Ninja
        run: |
          choco install llvm --version=20.1.8 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "pinned LLVM unavailable, installing the latest"; choco install llvm -y --no-progress }
          choco install cmake ninja -y --no-progress
          clang --version
          # the SDK's submodules hold paths longer than 260 characters
          git config --global core.longpaths true
      - name: Fetch the pinned SDK (or the sdk_commit snapshot)
        env:
          REXGLUE_SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: scripts\fetch-rexglue-sdk.ps1
      - name: Build rexglue.exe
        run: scripts\build-rexglue-windows.ps1
      - name: Locate the tool
        id: tool
        shell: bash
        run: |
          exe=$(find third_party/rexglue-sdk/src/out -name rexglue.exe -not -path '*CMakeFiles*' | head -1)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          "$exe" --version
      - name: Codegen smoke test (license-free PowerPC programs)
        shell: bash
        env:
          CC: clang
          CXX: clang++
          NATIVE_RUN: ${{ inputs.native_run && 'true' || 'false' }}
        run: |
          # The official LLVM builds for Windows have no PowerPC backend (X86/ARM/AArch64 only), so the
          # two C test programs cannot be built here and --allow-no-ppc-clang skips them (Linux CI covers
          # them); the TTT2-shaped assembly programs are assembled with the SDK's Cygwin-built PowerPC
          # binutils (.exe). With native_run the SDK source tree is passed too and --exec builds
          # recomp/tests/host (the runtime) and runs the switch-table program natively on Windows.
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          if [ "$NATIVE_RUN" = true ]; then
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" third_party/rexglue-sdk/src out/codegen-smoke --exec --allow-no-ppc-clang
          else
            scripts/codegen-smoke-test.sh "${{ steps.tool.outputs.exe }}" "" out/codegen-smoke --allow-no-ppc-clang
          fi
      - name: Upload rexglue.exe
        # Even when the smoke test fails: the tool itself is the deliverable the owner downloads.
        if: always() && steps.tool.outputs.exe != ''
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-win-amd64
          path: ${{ steps.tool.outputs.exe }}
          retention-days: 90
      # --- optional: the game host built the way a player builds it ---------------------------------
      - name: Install the SDK as a CMake package (runtime, GPU plugin, SDL3; long)
        if: inputs.build_host
        run: scripts\build-rexglue-windows.ps1 -Install
      - name: Relocate the installed package and add the licences (the owner's download)
        # The package is moved away from where CMake installed it: the host below is built from the moved
        # copy, which proves the owner can unzip the artifact anywhere (-SdkInstall). The SDK installs only
        # SDL3's licence, so its own BSD-3-Clause text, every vendored component's licence file and the
        # source commit are added for redistribution (docs/DEPENDENCIES.md).
        if: inputs.build_host
        shell: bash
        run: |
          sdk=third_party/rexglue-sdk/src
          mkdir -p out
          mv "$sdk/out/install/win-amd64" out/rexglue-sdk-install
          lic=out/rexglue-sdk-install/share/licenses
          mkdir -p "$lic/rexglue-sdk"
          cp "$sdk/LICENSE" "$lic/rexglue-sdk/LICENSE"
          git -C "$sdk" rev-parse HEAD > "$lic/rexglue-sdk/SOURCE_COMMIT.txt"
          echo "https://github.com/rexglue/rexglue-sdk" >> "$lic/rexglue-sdk/SOURCE_COMMIT.txt"
          notices="$lic/NOTICES.txt"
          {
            echo "Third-party components vendored by the ReXGlue SDK at the commit in rexglue-sdk/SOURCE_COMMIT.txt."
            echo "Each folder here holds the licence file(s) a component ships at its top level or one level down."
            echo "Components without such a file carry their licence text in their source file headers in the SDK tree"
            echo "(thirdparty/<name>/); they are listed below."
            echo
          } > "$notices"
          for d in "$sdk"/thirdparty/*/; do
            name=$(basename "$d")
            found=0
            for f in "$d"LICENSE* "$d"License* "$d"license* "$d"COPYING* "$d"COPYRIGHT* "$d"UNLICENSE* \
                     "$d"*/LICENSE* "$d"*/License* "$d"*/license* "$d"*/COPYING* "$d"*/COPYRIGHT* "$d"*/UNLICENSE*; do
              [ -f "$f" ] || continue
              mkdir -p "$lic/$name"
              cp "$f" "$lic/$name/"
              found=1
            done
            [ "$found" = 1 ] || echo "no licence file: $name (licence text in its source headers)" >> "$notices"
          done
          ls "$lic"
          cat "$notices"
          du -sh out/rexglue-sdk-install
      - name: Upload the installed SDK package (the owner downloads this instead of building the SDK)
        if: inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-sdk-install-win-amd64
          path: out/rexglue-sdk-install/
          retention-days: 90
      - name: Build the first-party tools (ttt2-xexinfo, ttt2-iso, the retail-form wrapper and the test-disc writer; VS 2022)
        if: inputs.build_host
        run: |
          cmake --preset windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }
          cmake --build --preset windows-msvc --target ttt2-xexinfo ttt2-iso ttt2_make_retail_xex ttt2_make_test_iso
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          .\out\build\windows-msvc\bin\Release\ttt2-xexinfo.exe --version
      - name: Pack the license-free kernel-import program as the host's game image, in the disc's retail form, and prepare it
        # The owner's path: the executable arrives AES-encrypted and basic-compressed, which neither the finder nor
        # codegen read; the pipeline's step 5c (ttt2-xexinfo --write-plain) prepares the plain image they do, and
        # build-host.ps1 below builds from that file.
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          mkdir -p recomp/game out/host-retail
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/imports_ttt2.s out/host-retail/plain.xex
          out/build/windows-msvc/bin/Release/ttt2_make_retail_xex.exe out/host-retail/plain.xex out/host-retail/default.xex
          out/build/windows-msvc/bin/Release/ttt2-xexinfo.exe out/host-retail/default.xex --write-plain recomp/game/default.xex --no-hash | tail -3
      - name: Build ttt2.exe against the relocated SDK package (codegen runs inside the build)
        # build-host.ps1 runs codegen through recomp\tools\resolve_functions.py; on this image the first round
        # must succeed (no unresolved calls), which the resolver's report states. It then audits every bctr
        # (recomp\tools\audit_switches.py): this program has none, and the audit must say so cleanly.
        if: inputs.build_host
        run: |
          scripts\build-host.ps1 -SdkInstall out\rexglue-sdk-install -Jobs 2 6>&1 | Tee-Object -FilePath out\build-host.log
          if (-not (Select-String -Path out\build-host.log -Pattern "Host build took [0-9.,]+ minutes" -Quiet)) { throw "build-host.ps1 did not report its build time" }
          if (-not (Select-String -Path recomp\game\resolve-REPORT.md -Pattern "codegen succeeded in round 1" -Quiet)) { throw "the resolver did not report a first-round success" }
          if (-not (Select-String -Path recomp\game\switch-audit.md -Pattern "Address-mapping problems \| 0 \|" -Quiet)) { throw "the switch audit did not run cleanly" }
      - name: Boot ttt2.exe on the license-free image (no GPU plugin) and check its log
        # The real host on Windows: window, runtime, recompiled code, Ttt2App hooks and the kernel
        # overrides; the program ends and the host must exit with code 0 (scripts/host-boot-test.sh).
        if: inputs.build_host
        shell: bash
        run: scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 120
      - name: Boot ttt2.exe on the retail-form executable (what the owner's extracted game folder holds)
        # The runtime must decrypt and decompress the disc's default.xex itself when it loads it; same host,
        # the retail-form file as the game root's executable.
        if: inputs.build_host
        shell: bash
        run: scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe out/host-retail 120
      - name: Run the owner's boot step (scripts\run-host.ps1) on the same image
        # The one command of docs\OWNER_CHECKLIST.md step 6: runs the host, waits for its exit, triages the
        # log (recomp\tools\triage_boot_log.py), copies it and writes the run report. The program ends by
        # itself here, so the host must exit 0 and the triage report a clean exit.
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host -TimeoutSeconds 120 -NoGpu
          if ($LASTEXITCODE -ne 0) { throw "run-host.ps1 exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out\run-host\boot-triage.md -Pattern "clean exit" -Quiet)) { throw "the triage did not report a clean exit" }
          if (-not (Get-ChildItem out\run-host\boot-logs -File)) { throw "no log copy in out\run-host\boot-logs" }
      - name: Boot ttt2.exe with the Xenos GPU plugin (D3D12 on the runner's software adapter; informative)
        # The first exercise of the graphics path: plugin load, D3D12 device, presentation. The runner
        # has no GPU, so this may fail for reasons the owner's machine will not have; it never blocks.
        if: inputs.build_host
        continue-on-error: true
        shell: bash
        run: |
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 120 --gpu
          cp recomp/out/build/win-amd64-release/logs/*.log out/host-gpu-boot.log 2>/dev/null || true
      - name: Upload the GPU boot log
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-gpu-boot-log
          path: out/host-gpu-boot.log
          if-no-files-found: ignore
      - name: Boot ttt2.exe on the crashing and the stalling programs (crash report, stall dump)
        # The same host rebuilt on recomp/tests/ppc/crash_ttt2.s (writes to the null page: HOST CRASH
        # block, exit code 3) and stall_ttt2.s (spins forever: the watchdog's per-thread stall dump).
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          for program in crash stall; do
            scripts/make-ppc-test-xex.sh "recomp/tests/ppc/${program}_ttt2.s" recomp/game/default.xex
            python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json "out/host-switch_tables-$program.json"
            # codegen through the function-boundary resolver, as build-host.ps1 runs it
            python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
              --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
              --reference recomp/ttt2_functions.ttt2web.toml --log "out/host-codegen-$program.log" \
              --report "out/host-resolve-$program.md" --ignore-stamp
            (cd recomp && cmake --build --preset win-amd64-release)
            scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game "--expect-$program"
          done
      - name: Run the owner's boot step on the stalling program (the timeout closes the window)
        # The host is still built on stall_ttt2.s: with a 1 s watchdog period the stall dump appears within a
        # few seconds, the 8 s timeout sends the close request the X button sends (taskkill), the host writes
        # its stub report and exits 0, and the triage must report the stall and the close.
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
          TTT2_WATCHDOG_MS: "1000"
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host-stall -TimeoutSeconds 8 -NoGpu
          if ($LASTEXITCODE -ne 0) { throw "run-host.ps1 exit code $LASTEXITCODE" }
          $md = Get-Content out\run-host-stall\boot-triage.md -Raw
          if ($md -notmatch "\*\*stall: .*closed afterwards\*\*") { throw "the triage did not report the stall and the close" }
          Get-Content out\run-host-stall\boot-report.txt
      - name: Boot ttt2.exe on a deliberate deadlock (the boot monitor's stall dump)
        # The same host rebuilt on recomp/tests/ppc/wait_ttt2.s: two threads deadlocked on a critical section and an
        # event nobody sets. The stall dump must name both waits (the section with its owner, the unsignaled event),
        # their guest call sites and stacks, and the worker's creation; the host's export wrappers must have found
        # the runtime's originals in rexruntime.dll (GetProcAddress) for any of that to work.
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/wait_ttt2.s recomp/game/default.xex
          python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-wait.json
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen-wait.log \
            --report out/host-resolve-wait.md --ignore-stamp
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game --expect-stall --expect-waits
      - name: Run the owner's boot step on the deadlock (the triage reports the wait chain)
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
          TTT2_WATCHDOG_MS: "1000"
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host-wait -TimeoutSeconds 8 -NoGpu
          if ($LASTEXITCODE -ne 0) { throw "run-host.ps1 exit code $LASTEXITCODE" }
          $md = Get-Content out\run-host-wait\boot-triage.md -Raw
          if ($md -notmatch "(?m)^\d+\. Wait chain: .* waits for a lock held by .*, which waits: KeWaitForSingleObject") { throw "the triage did not report the wait chain: $md" }
          if ($md -notmatch "(?m)^## Thread state at window close") { throw "the triage did not read the window-close dump" }
          if ($md -notmatch "(?m)^\d+\. .* \(id \d+\) spins: ") { throw "the triage did not name the spinning thread: $md" }
      - name: Boot ttt2.exe on the file-system program (sector query, the bare Image device, missing names)
        # recomp/tests/ppc/io_ttt2.s: the disc sector query answered as unsupported by the host, the bare device
        # \Device\Image failing with the runtime's "ResolvePath(\Device)" line from the owner's boot and answered as a
        # missing name the way the console answers it, each traced.
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/io_ttt2.s recomp/game/default.xex
          python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-io.json
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen-io.log \
            --report out/host-resolve-io.md --ignore-stamp
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 60 --no-imports --expect-io
      - name: Boot ttt2.exe on four frames of GPU commands (the frame monitor)
        # recomp/tests/ppc/gpu_ttt2.s: draws, a clearing resolve, an indirect buffer, a packet the GPU emulation skips
        # and a frame that wraps around the end of the ring buffer, each counted by the host, and a frame outside the
        # ring that cannot be followed without a GPU emulation (counted as not followed, its draws unknown).
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/gpu_ttt2.s recomp/game/default.xex
          python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-gpu.json
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference recomp/ttt2_functions.ttt2web.toml --log out/host-codegen-gpu.log \
            --report out/host-resolve-gpu.md --ignore-stamp
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 60 --no-imports --expect-gpu-frames
      - name: Function-boundary cycle on ttt2.exe, part 1 (resolved codegen; the runtime trap ends the run with code 4)
        # recomp/tests/ppc/tailcall_ttt2.s with its boundary table as the reference: codegen through the resolver adds
        # the two entries its errors call for; the host then calls a leaf only a pointer reaches, which nothing
        # registered: the runtime's trap must end the process with exit code 4 (Ttt2App's abort handler), not a dialog.
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/tailcall_ttt2.s recomp/game/default.xex
          python -I recomp/tests/ppc/functions_to_toml.py recomp/game/default.xex.syms recomp/tests/ppc/tailcall_ttt2.functions out/tailcall-reference.toml
          python -I recomp/tools/find_switch_tables.py recomp/game/default.xex --toml recomp/game/ttt2_switch_tables.toml --json out/host-switch_tables-tailcall.json
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference out/tailcall-reference.toml --log out/host-codegen-tailcall.log --report out/host-resolve-tailcall.md --ignore-stamp
          grep -q "codegen succeeded in round 2 with 2 resolved entries" out/host-resolve-tailcall.md
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 60 --expect-fatal
      - name: Function-boundary cycle, part 2 (the owner's boot step on it; the triage names the called address)
        if: inputs.build_host
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          scripts\run-host.ps1 -GameRoot recomp\game -Work out\run-host-fatal -TimeoutSeconds 60 -NoGpu
          if ($LASTEXITCODE -ne 4) { throw "run-host.ps1 exit code $LASTEXITCODE, expected 4 (the runtime aborted)" }
          $md = Get-Content out\run-host-fatal\boot-triage.md -Raw
          if ($md -notmatch "fatal: the game called 0x[0-9A-F]+ through a pointer") { throw "the triage did not report the call to an unregistered function: $md" }
          $global:LASTEXITCODE = 0
      - name: Function-boundary cycle, part 3 (resolve from the boot log, rebuild, run to the end)
        if: inputs.build_host
        shell: bash
        run: |
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          python -I recomp/tools/resolve_functions.py boot --image recomp/game/default.xex \
            --boot-log "$(ls -t out/run-host-fatal/boot-logs/*.log | head -1)" --codegen-log out/host-codegen-tailcall.log \
            --reference out/tailcall-reference.toml --out recomp/game/ttt2_resolved_functions.toml --report out/host-resolve-tailcall-boot.md
          grep -q "all 1 called addresses verified (1 new entries)" out/host-resolve-tailcall-boot.md
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference out/tailcall-reference.toml --log out/host-codegen-tailcall2.log --report out/host-resolve-tailcall2.md --ignore-stamp
          grep -q "codegen succeeded in round 1 with 3 resolved entries" out/host-resolve-tailcall2.md
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 60 --no-imports
      - name: Function-boundary cycle, part 4 (from scratch with --indirect; no trap, no extra rebuild)
        # The same program with a fresh resolved file: after the two entries its codegen errors call for, the
        # resolver registers the pointer-called leaf ahead of time (its address is in .rdata), so the first run
        # ends cleanly; parts 1 to 3 needed the trap, its log and a rebuild for it.
        if: inputs.build_host
        shell: bash
        run: |
          rexglue="$PWD/out/rexglue-sdk-install/bin/rexglue.exe"
          rm -f recomp/game/ttt2_resolved_functions.toml
          python -I recomp/tools/resolve_functions.py codegen --rexglue "$rexglue" --manifest recomp/ttt2_manifest.toml \
            --image recomp/game/default.xex --out recomp/game/ttt2_resolved_functions.toml \
            --reference out/tailcall-reference.toml --log out/host-codegen-tailcall3.log --report out/host-resolve-tailcall3.md \
            --ignore-stamp --indirect --switch-json out/host-switch_tables-tailcall.json
          grep -q "codegen succeeded in round 3 with 3 resolved entries (1 of them ahead of time)" out/host-resolve-tailcall3.md
          (cd recomp && cmake --build --preset win-amd64-release)
          scripts/host-boot-test.sh recomp/out/build/win-amd64-release/ttt2.exe recomp/game 60 --no-imports
      - name: Pack the pointer test program as a disc in the retail form (input of the owner pipeline runs below)
        # recomp/tests/ppc/pointer_ttt2.s has two functions only a pointer reaches, which ReXGlue folds into the
        # functions that branch to them: each one traps at run time unless it is registered.
        if: inputs.build_host
        shell: bash
        run: |
          export TTT2_PPC_BINUTILS="$PWD/third_party/rexglue-sdk/src/tools/binutils"
          mkdir -p out/e2e
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/pointer_ttt2.s out/e2e/plain.xex
          out/build/windows-msvc/bin/Release/ttt2_make_retail_xex.exe out/e2e/plain.xex out/e2e/default.xex
          out/build/windows-msvc/bin/Release/ttt2_make_test_iso.exe out/e2e/disc.iso default.xex=out/e2e/default.xex
          python -I recomp/tests/ppc/functions_to_toml.py out/e2e/plain.xex.syms recomp/tests/ppc/pointer_ttt2.functions out/e2e/reference.toml
          for s in cond_target over_target; do tr -d '\r' < out/e2e/plain.xex.syms | awk -v n="$s" '$4 == n {print $1}' > "out/e2e/$s.txt"; done
          cat out/e2e/cond_target.txt out/e2e/over_target.txt
      - name: Owner pipeline end to end, boot repair from the boot logs alone (-NoIndirect; two automatic rebuilds)
        # scripts\owner-pipeline.ps1 under Windows PowerShell 5.1, as the owner runs it, on the test disc: identify,
        # extract, prepare, codegen, host build, extraction, then the boot repair loop by itself. Without entries
        # registered ahead of time, each pointer-only function ends a run with the runtime's trap: run 1 at
        # cond_target, run 2 (after the loop's own rebuild) at over_target, run 3 ends cleanly. -MinFreeGb 1: the
        # runner's disk is small (the owner keeps the default 5).
        # The CRITICAL check is case-sensitive: the triage in the report lists the host log's "critical" level.
        if: inputs.build_host
        shell: powershell
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          $ct = (Get-Content out\e2e\cond_target.txt).Trim()
          $ot = (Get-Content out\e2e\over_target.txt).Trim()
          if (Test-Path recomp\game\ttt2_resolved_functions.toml) { Remove-Item recomp\game\ttt2_resolved_functions.toml }
          try {
            scripts\owner-pipeline.ps1 -Iso out\e2e\disc.iso -Work out\e2e\work-plain -Preset windows-msvc -SkipBuild -Codegen -BuildHost -SdkInstall out\rexglue-sdk-install -ExtractGame -Boot -BootTimeout 60 -NoGpu -NoIndirect -MinFreeGb 1 -Reference out\e2e\reference.toml *> out\e2e\pipeline-plain.log
          } catch { Get-Content out\e2e\pipeline-plain.log -Tail 60; throw }
          $report = Get-Content out\e2e\work-plain\report.txt -Raw
          foreach ($needle in @('-NoIndirect: nothing registered ahead of time', "run 1: fatal: the game called $ct through a pointer[^\r\n]*; added $ct",
                                "run 2: fatal: the game called $ot through a pointer[^\r\n]*; added $ot", 'run 3: clean exit',
                                '3 runs in [0-9.,]+ minutes:', 'Stopped: run 3 did not end on a call to an unregistered function',
                                '2 verified entries \(0 of them registered ahead of time\), kept for the next run')) {
            if ($report -notmatch $needle) { Get-Content out\e2e\work-plain\report.txt -Tail 80; throw "report lacks '$needle'" }
          }
          if ($report -cmatch '(?m)^CRITICAL: ') { throw "the pipeline stopped on a critical failure" }
          Write-Host "boot repair from the boot logs: 3 runs, 2 automatic rebuilds, clean end"
      - name: Owner pipeline end to end with the functions registered ahead of time (the default; no rebuild)
        # The same disc and command without -NoIndirect, from an empty resolved file: step 6 registers both
        # pointer-only functions ahead of time, so the first run ends cleanly and the loop has nothing to repair.
        if: inputs.build_host
        shell: powershell
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          Remove-Item recomp\game\ttt2_resolved_functions.toml
          try {
            scripts\owner-pipeline.ps1 -Iso out\e2e\disc.iso -Work out\e2e\work-aot -Preset windows-msvc -SkipBuild -Codegen -BuildHost -SdkInstall out\rexglue-sdk-install -ExtractGame -Boot -BootTimeout 60 -NoGpu -MinFreeGb 1 -Reference out\e2e\reference.toml *> out\e2e\pipeline-aot.log
          } catch { Get-Content out\e2e\pipeline-aot.log -Tail 60; throw }
          $report = Get-Content out\e2e\work-aot\report.txt -Raw
          foreach ($needle in @('codegen succeeded in round 2 with 2 resolved entries \(2 of them ahead of time\)',
                                '2 functions registered ahead of time; codegen accepted them in round 2', 'run 1: clean exit',
                                '1 run in [0-9.,]+ minutes:', 'Stopped: run 1 did not end on a call to an unregistered function',
                                '2 verified entries \(2 of them registered ahead of time\), kept for the next run')) {
            if ($report -notmatch $needle) { Get-Content out\e2e\work-aot\report.txt -Tail 80; throw "report lacks '$needle'" }
          }
          if ($report -match '9b\. Calls to functions ReXGlue never registered') { throw "the loop had to repair a run" }
          if ($report -cmatch '(?m)^CRITICAL: ') { throw "the pipeline stopped on a critical failure" }
          Write-Host "ahead of time: both functions registered in step 6, the first run ends cleanly"
      - name: Upload the host boot log and the boot-step reports
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-boot-log
          path: |
            recomp/out/build/win-amd64-release/logs/
            out/run-host/
            out/run-host-stall/
            out/run-host-wait/
            out/run-host-fatal/
            out/host-resolve*.md
            out/e2e/work-*/report.txt
            out/e2e/work-*/resolve-*.md
            out/e2e/work-*/boot-triage.md
            out/e2e/pipeline-*.log
          if-no-files-found: ignore
      - name: Upload the host build listing
        if: always() && inputs.build_host
        uses: actions/upload-artifact@v4
        with:
          name: host-win-amd64-listing
          path: recomp/out/build/win-amd64-release/host-listing.txt
          if-no-files-found: ignore
      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-smoke-reports
          path: |
            out/codegen-smoke/**/REPORT.md
            out/codegen-smoke/**/report.json
            out/codegen-smoke/**/codegen.log
