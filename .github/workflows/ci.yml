name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**", "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene (no game content, no secrets) and Python tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repo_hygiene.py
      - name: Python tool unit tests (codegen report on synthetic output)
        run: python3 -I -m unittest discover -s tests/python -v
      - name: Switch-table finder and packer compile
        run: python3 -I -m py_compile recomp/tools/find_switch_tables.py scripts/ppc_elf_to_xex.py scripts/check_instruction_coverage.py scripts/gen_xbox_exports.py

  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            preset: linux-clang
          - compiler: gcc
            preset: linux-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          # lld: the tool smoke test links license-free PowerPC test programs with ld.lld
          # (scripts/make-ppc-test-xex.sh), on the gcc job too.
          sudo apt-get install -y --no-install-recommends ninja-build clang lld g++ cmake
      - name: Fetch pinned XenonRecomp sources (ttt2-xexpatch, Clang only)
        if: matrix.compiler == 'clang'
        run: scripts/fetch-xenonrecomp.sh
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DTTT2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Tool smoke tests
        run: |
          ./out/build/${{ matrix.preset }}/bin/ttt2-xexinfo --version
          ./out/build/${{ matrix.preset }}/bin/ttt2-iso --version
          ./out/build/${{ matrix.preset }}/bin/ttt2-stfs --version
          ./out/build/${{ matrix.preset }}/bin/ttt2-validate --version
          if [ -x ./out/build/${{ matrix.preset }}/bin/ttt2-xexpatch ]; then ./out/build/${{ matrix.preset }}/bin/ttt2-xexpatch --version; fi
          # license-free PowerPC test images pack with the Linux toolchain (Clang + LLD + the packer)
          scripts/make-ppc-test-xex.sh recomp/tests/ppc/smoke.c out/smoke-test.xex && ./out/build/${{ matrix.preset }}/bin/ttt2-xexinfo out/smoke-test.xex --no-hash | head -5
          python3 -I recomp/tools/find_switch_tables.py out/smoke-test.xex
      - name: Hygiene check on the build tree (no game content may appear)
        run: python3 scripts/check_repo_hygiene.py

  windows-msvc:
    name: Windows MSVC (VS 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Test
        run: ctest --preset windows-msvc
      - name: Tool smoke test
        run: |
          .\out\build\windows-msvc\bin\Release\ttt2-xexinfo.exe --version
          .\out\build\windows-msvc\bin\Release\ttt2-validate.exe --version

  windows-clang-cl:
    name: Windows clang-cl (Ninja)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch pinned XenonRecomp sources (ttt2-xexpatch)
        run: scripts\fetch-xenonrecomp.ps1
      - name: Configure
        run: cmake --preset windows-clang-cl
      - name: Build
        run: cmake --build --preset windows-clang-cl
      - name: Test
        run: ctest --preset windows-clang-cl
      - name: Owner pipeline dry run on the synthetic fixtures (no game content)
        # The one-command owner workflow on real PowerShell with the built tools: disc and title
        # update identification, extraction, the patch attempt (the synthetic delta is not a real
        # patch, so step 5 is expected to report a failure and the later steps work from the base
        # image), the import/helper scan and -ExtractGame (disc and title update files). The
        # fixtures come from the validate_fixtures ctest above.
        # Windows PowerShell 5.1 (shell: powershell), the owner's likely shell: stricter about native
        # tools writing to stderr than PowerShell 7.
        shell: powershell
        run: |
          $fx = "out\build\windows-clang-cl\tests\validate-fixtures"
          scripts\owner-pipeline.ps1 -Iso "$fx\synthetic.iso" -TitleUpdate "$fx\TU_SYNTHETIC" -Work out\pipeline-work -SkipBuild -ExtractGame -Boot
          $report = Get-Content out\pipeline-work\report.txt -Raw
          foreach ($needle in @('Identified:\s+Tekken Tag Tournament 2 Title Update 3', 'extracted 3 files', 'extracted 1 files', 'ttt2\.exe is missing \(build it with -BuildHost', 'Report written to')) {
            if ($report -notmatch $needle) { throw "report lacks '$needle'" }
          }
          Write-Host "pipeline report OK ($((Get-Content out\pipeline-work\report.txt).Count) lines)"
          # The boot step itself without a host (no SDK here): Windows PowerShell 5.1 must parse it and it
          # must report the missing executable with exit code 2 (its lines are Write-Host output, which only
          # *>&1 captures under 5.1).
          $bootOut = scripts\run-host.ps1 -Exe out\no-such-ttt2.exe -GameRoot out\pipeline-work\game -Work out\pipeline-work *>&1 | Out-String
          if ($LASTEXITCODE -ne 2) { throw "run-host.ps1 without a host: exit code $LASTEXITCODE, expected 2; output: $bootOut" }
          if ($bootOut -notmatch 'host executable not found') { throw "run-host.ps1 did not report the missing host: $bootOut" }
          $global:LASTEXITCODE = 0
          Write-Host "run-host.ps1 prerequisite check OK"
